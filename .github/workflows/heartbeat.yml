name: Repo Heartbeat

# GitHub auto-disables scheduled workflows after 60 days of no repo activity.
# A scheduled workflow merely RUNNING does not reset that timer — only commits
# do — so this makes one tiny commit a month to keep keep-alive.yml alive.

on:
  schedule:
    # 00:00 UTC on the 1st of every month — well inside the 60-day window
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    if: vars.ENABLE_GITHUB_ACTIONS == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update heartbeat timestamp and commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git diff --cached --quiet || git commit -m "chore: monthly heartbeat to keep scheduled workflows enabled"
          git push
